# docker-compose.yml
# Runs the full stack on an Intel SGX machine. No env files or external
# services are required.
# On an x86 machine WITHOUT SGX, run the enclave in simulation mode instead:
# remove the "devices" section below and set OE_SIMULATION=1 on the backend.

services:
  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./submodule/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080/api/analyze
    ports:
      - "3000:3000"
    networks:
      - sentiment-net
    depends_on:
      - backend
    restart: unless-stopped

  # Backend Service (Go + Open Enclave, SGX)
  backend:
    build:
      context: ./submodule/backend
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      - ALLOWED_ORIGIN=http://localhost:3000
    devices:
      - "/dev/sgx_enclave:/dev/sgx_enclave"
      - "/dev/sgx_provision:/dev/sgx_provision"
    ports:
      - "8080:8080"
    networks:
      - sentiment-net
    restart: unless-stopped

# Defines the network that allows services to communicate
networks:
  sentiment-net:
    driver: bridge
